# CosmoQMS — PostgreSQL 16 + migraciones + seguridad de BD + app.
#
# Secretos: POSTGRES_PASSWORD y RUNTIME_DB_PASSWORD se leen del archivo .env
# (nunca se commitea). Generarlos con:  openssl rand -hex 24
# Modo demo (sin Clerk, solo en localhost):
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
# HTTPS con Caddy:  docker compose --profile https up -d

x-owner-url: &owner-url postgresql://cosmoqms_app:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}@db:5432/cosmoqms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmoqms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: cosmoqms
    ports:
      # Solo en esta máquina: la base nunca queda expuesta a la red.
      - "127.0.0.1:5433:5432"
    volumes:
      - cosmoqms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmoqms_app -d cosmoqms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations as the table owner, then
  # exits. Uses the `builder` stage of the Dockerfile, which still has the
  # Prisma CLI (the slim runtime image does not).
  migrate:
    build:
      context: .
      target: builder
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *owner-url
      DIRECT_URL: *owner-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot: (re)creates the unprivileged runtime role and applies the Row
  # Level Security policies. Runs after every migration so new tables are
  # covered too.
  db-security:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1 -v runtime_password="$$RUNTIME_DB_PASSWORD" -f /db/runtime-role.sql &&
        psql -v ON_ERROR_STOP=1 -f /db/rls.sql
    environment:
      PGHOST: db
      PGUSER: cosmoqms_app
      PGDATABASE: cosmoqms
      PGPASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Falta RUNTIME_DB_PASSWORD en .env}
    volumes:
      - ./db:/db:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  cosmoqms:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      # The app connects as cosmoqms_runtime: RLS applies to it (CLAUDE.md
      # rule 4). The owner role is only for migrations.
      DATABASE_URL: postgresql://cosmoqms_runtime:${RUNTIME_DB_PASSWORD:?Falta RUNTIME_DB_PASSWORD en .env}@db:5432/cosmoqms
      DIRECT_URL: postgresql://cosmoqms_runtime:${RUNTIME_DB_PASSWORD:?Falta RUNTIME_DB_PASSWORD en .env}@db:5432/cosmoqms
      # Never inherit demo mode from .env; only docker-compose.demo.yml sets it.
      DEMO_MODE: "false"
      TZ: America/Bogota
      STORAGE_DRIVER: local
    volumes:
      - cosmoqms-storage:/app/storage
    depends_on:
      db-security:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional HTTPS reverse proxy. With APP_DOMAIN=localhost (default) Caddy
  # uses its own local certificate; with a real domain pointed at this
  # server it obtains a Let's Encrypt certificate automatically.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      cosmoqms:
        condition: service_healthy

volumes:
  cosmoqms-db-data:
  cosmoqms-storage:
  caddy-data:
  caddy-config:
